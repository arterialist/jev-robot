name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.8"

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Run offline unit tests
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Install Linux rendering libraries
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libegl-mesa0 libgl1
      - name: Run the offline simulator
        if: runner.os == 'Linux' && matrix.python == '3.12'
        env:
          MUJOCO_GL: egl
        run: uv run --frozen jev-robot --headless --offline --seconds 2 --no-realtime --capture "$RUNNER_TEMP/g1-smoke.png"
      - name: Save the smoke-test frame
        if: runner.os == 'Linux' && matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-simulation-frame
          path: ${{ runner.temp }}/g1-smoke.png
          if-no-files-found: error
          retention-days: 14

  devcontainer:
    name: Build dev container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the documented development image
        run: docker build --pull --tag jev-robot-devcheck --file .devcontainer/Dockerfile .

  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Build source and wheel distributions
        run: uv build --no-sources
      - name: Check the packaged browser assets
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel, = Path("dist").glob("*.whl")
          required = {
              "jev_robot/static/index.html",
              "jev_robot/static/control-room.css",
              "jev_robot/static/control-room.js",
          }
          with ZipFile(wheel) as archive:
              missing = required.difference(archive.namelist())
          if missing:
              raise SystemExit(f"Wheel is missing browser assets: {sorted(missing)}")
          print(f"Verified browser assets in {wheel.name}")
          PY
      - name: Save distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
