name: Feature request
description: Propose a concrete change to the robot demo or development tools.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task or limitation you encountered.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the change from a user's perspective. Include an example command or interaction if useful.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: How would we verify it?
      description: Describe a reproducible scenario, visible result, or measurement that would show the change works.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include relevant existing controls, upstream projects, or workarounds.
