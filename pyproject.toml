[project]
name = "jev-robot"
version = "0.1.0"
description = "Unitree G1 in MuJoCo with JEV reflexes and Gemini planning"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "arterialist"}]
keywords = ["robotics", "mujoco", "unitree-g1", "jev", "gemini", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "google-genai>=1.0",
    "httpx>=0.28",
    "mujoco>=3.3.6",
    "numpy>=2.0",
    "onnxruntime>=1.22",
    "platformdirs>=4.3",
    "pillow>=11.0",
    "pydantic>=2.11",
    "PyYAML>=6.0",
    "python-dotenv>=1.1",
    "rich>=14.0",
    "uvicorn[standard]>=0.35",
    "wsproto>=1.3.2",
]

[project.urls]
Homepage = "https://github.com/arterialist/jev-robot"
Repository = "https://github.com/arterialist/jev-robot"
Documentation = "https://github.com/arterialist/jev-robot/tree/main/docs"
Issues = "https://github.com/arterialist/jev-robot/issues"

[project.scripts]
jev-robot = "jev_robot.app:main"
jev-robot-web = "jev_robot.web:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_robot"]
